<h2 id="jq">jq<a aria-hidden="true" class="anchor-heading icon-link" href="#jq"></a></h2>
<p><code>jq</code> is a lightweight and flexible command-line JSON processor, similar to <code>awk</code>, <code>grep</code>, and <code>sed</code>.
It allows you to slice, filter, map, and transform structured JSON data with ease.</p>
